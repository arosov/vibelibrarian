# .github/workflows/package-android.yml
name: Package Android App (Debug)

# Allow manual triggering of this workflow
on:
  workflow_dispatch:

jobs:
  package-android:
    name: Build and Package Android Debug APK
    runs-on: ubuntu-latest # Use a Linux runner for Android builds

    permissions:
      contents: write # Needed to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        # This task builds the debuggable APK for the Android target
        run: ./gradlew :composeApp:assembleDebug

      - name: Determine APK Path and Name
        id: package_info
        # Default path for the debug APK
        run: |
          echo "apk_path=composeApp/build/outputs/apk/debug/composeApp-debug.apk" >> $GITHUB_OUTPUT
          echo "apk_name=VibeLibrarian-android-debug-${{ github.run_id }}.apk" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: android-debug-build-${{ github.run_id }}
          release_name: Android Debug Build ${{ github.run_id }}
          draft: true
          prerelease: true # Mark as pre-release since it's a debug build

      - name: Upload Release Asset (APK)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.package_info.outputs.apk_path }}
          asset_name: ${{ steps.package_info.outputs.apk_name }}
          asset_content_type: application/vnd.android.package-archive
