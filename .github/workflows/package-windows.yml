# .github/workflows/package-windows.yml
name: Package Windows App

# Allow manual triggering of this workflow
on:
  workflow_dispatch:

jobs:
  package-windows:
    name: Build and Package Windows App
    runs-on: windows-latest # Use a Windows runner

    permissions:
      contents: write # Needed to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Windows Distribution Package
        # This task builds the distributable package for the current OS (Windows)
        run: ./gradlew :composeApp:packageDistributionForCurrentOS

      - name: Determine MSI Path and Name
        id: package_info
        # Default path for the MSI installer. Assuming version 1.0.0 based on user input.
        # Note: This might need adjustment if the version changes.
        run: |
          echo "msi_path=composeApp\build\compose\binaries\main\msi\VibeLibrarian-1.0.0.msi" >> $env:GITHUB_OUTPUT
          echo "msi_name=VibeLibrarian-windows-${{ github.run_id }}.msi" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Draft Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: win-build-${{ github.run_id }}
          release_name: Windows Build ${{ github.run_id }}
          draft: true
          prerelease: false

      - name: Upload Release Asset (MSI)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.package_info.outputs.msi_path }}
          asset_name: ${{ steps.package_info.outputs.msi_name }}
          asset_content_type: application/x-msi
